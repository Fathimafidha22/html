<html>
<head>
<body bgcolor="green">
<h1><center>STRING AND MATH FUNCTION</h1>
<script>
var a="hello";
var b=123;
var c="welcome";
document.write("string 1=" + a + "<br><br>");
document.write("string 2=" + b + "<br><br>");
document.write("string 3=" + c + "<br><br>");
document.write("<h2><center>STRING FUNCTION</center></h2>");
document.write("fidha=" + a + b + c + "<br><br>");
document.write("uppercase=" + a.toUpperCase () + "<br><br>");
document.write("lowercase=" + a.toLowerCase () + "<br><br>");
document.write("slice=" + c.slice(3,7) + "<br><br>");
document.write("replace=" + c.replace("c","h") + "<br><br>");
document.write("length=" + c.length + "<br><br>");
document.write("<h3><center>MATH FUNCTION</center></h3>");
document.write("round=" + Math.round(2.5) + "<br><br>");
document.write("floor=" + Math.floor(2.5) + "<br><br>");
document.write("ceil=" + Math.ceil(3.5) + "<br><br>");
document.write("squareroot=" + Math.sqrt(25) + "<br><br>");
document.write("power=" + Math.pow(2,4) + "<br><br>");
document.write("maximum=" + Math.max(2,5,3) + "<br><br>");
document.write("minimum=" + Math.min(2,5,4) + "<br><br>");
document.write("absolute=" + Math.abs(-5) + "<br><br>");
</script>
</head>
</html>
